services:
  - type: web
    name: vendelote-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/ping
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

      # Base de datos (TiDB Cloud / MySQL)
      - key: VL_DB_URL
        sync: false
      - key: VL_DB_USER
        sync: false
      - key: DB_PASS
        sync: false

      # Seguridad
      - key: JWT_SECRET
        sync: false
      - key: SECRETS_ENCRYPTION_KEY
        sync: false

      # Semilla inicial
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_VENDEDOR
        value: "false"

      # CORS (dominio del frontend en Vercel)
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None

      # Integraciones
      - key: DECOLECTA_TOKEN
        sync: false
      - key: SUNAT_API_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
