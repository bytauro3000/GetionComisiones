# ===============================
# APLICACION
# ===============================
spring.application.name=Closure
server.port=${PORT:8080}

# ===============================
# DATASOURCE (por defecto local; en produccion usar variables de entorno)
# IMPORTANTE: se usan prefijos VL_ para NO chocar con las variables
# DB_URL/DB_USER del sistema (proyecto antiguo InmobiliariaIvan).
# Contraseña: se pasa por DB_PASS (launch config de STS o variable de entorno).
# ===============================
spring.datasource.url=${VL_DB_URL:}
spring.datasource.username=${VL_DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONNECTION POOL (HikariCP)
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-timezone=America/Lima

# ===============================
# JPA / HIBERNATE
# El esquema lo administra Flyway (db/migration). Hibernate solo VALIDA.
# En una BD existente, flyway.baseline-on-migrate la adopta en la version 1
# (no re-ejecuta el baseline) y aplica las migraciones posteriores (V2+).
# ===============================
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.show-sql=false

# ===============================
# FLYWAY - migraciones versionadas
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Baseline inicial (adopcion de BD existente)

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# ===============================
# JWT
# Access token: 30 minutos. Refresh token: 7 dias (cookie HttpOnly).
# En produccion JWT_SECRET es OBLIGATORIO (la app no arranca sin el).
# En desarrollo, si no se define, se genera una clave efimera al iniciar.
# Generar: openssl rand -base64 48
# ===============================
jwt.secret-key=${JWT_SECRET:}
jwt.refresh-expiration=604800000

# ===============================
# CIFRADO DE SECRETOS EN REPOSO (AES/GCM) - credenciales api-sunat, etc.
# En produccion es OBLIGATORIA (la app no arranca sin ella).
# En desarrollo, si no se define, se usa una clave "solo-dev".
# Generar: openssl rand -base64 32
# IMPORTANTE: si cambia esta clave, los secretos ya cifrados no se podran leer.
# ===============================
secrets.encryption-key=${SECRETS_ENCRYPTION_KEY:}

# ===============================
# COOKIE REFRESH TOKEN
# Produccion (HTTPS + frontend en otro dominio):
#   jwt.cookie-secure=true / jwt.cookie-same-site=None
# Desarrollo local (http://localhost:4200 -> http://localhost:8080, mismo site):
#   jwt.cookie-secure=false / jwt.cookie-same-site=Lax
# ===============================
jwt.cookie-secure=${COOKIE_SECURE:false}
jwt.cookie-same-site=${COOKIE_SAME_SITE:Lax}

# ===============================
# CORS - origen permitido del frontend
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===============================
# SEPARACIONES - liberacion automatica de lotes vencidos
# Cron por defecto: todos los dias a las 00:30 (America/Lima).
# Formato Spring: seg min hora dia-del-mes mes dia-de-la-semana
# ===============================
app.separaciones.expiracion-cron=${SEPARACIONES_EXPIRACION_CRON:0 30 0 * * *}

# ===============================
# SEGURIDAD MVC
# ===============================
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# USUARIO ADMINISTRADOR INICIAL (solo si la tabla usuario esta vacia)
# Cambiar la password tras el primer inicio de sesion.
# En produccion definir SEED_ADMIN_PASSWORD como variable de entorno.
# ===============================
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@vendelote.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin1234}
# Crea un vendedor de prueba solo si esta en true (dejar false en produccion).
app.seed.create-demo-vendedor=${SEED_DEMO_VENDEDOR:true}

# ===============================
# DECOLECTA - consulta DNI (RENIEC) y RUC (SUNAT)
# Token UNICO de la plataforma (lo paga el SaaS): https://decolecta.com/profile
# Cuota gratuita ~100 consultas/mes -> las respuestas se cachean 1h en memoria.
# Sin DECOLECTA_TOKEN la consulta DNI/RUC queda deshabilitada (fail-safe: el
# usuario continua escribiendo los datos a mano).
# ===============================
decolecta.api.url=${DECOLECTA_URL:https://api.decolecta.com}
decolecta.api.token=${DECOLECTA_TOKEN:}

# ===============================
# API-SUNAT (facturacion electronica propia)
# Base URL COMPLETA incluyendo /api/v1. Las credenciales X-Api-Key/Secret
# son POR TENANT y viven en la tabla integracion_sunat (no aqui).
# ===============================
sunat.api.url=${SUNAT_API_URL:http://localhost:8000/api/v1}

# ===============================
# SUBIDA DE ARCHIVOS (planos de proyecto)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
app.uploads.dir=${VL_UPLOADS_DIR:uploads/planos}

# ===============================
# CLOUDINARY (nube de planos)
# Si las 3 variables están vacías → los planos se guardan en disco (fallback local)
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
