# Perfil de PRODUCCION (activar con SPRING_PROFILES_ACTIVE=prod)

# Render termina el TLS en su proxy: respetar X-Forwarded-* (IP real, esquema https)
server.forward-headers-strategy=framework

# El esquema lo administra Flyway; Hibernate solo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Cookies para frontend en OTRO dominio (Vercel -> Render): Secure + SameSite=None
jwt.cookie-secure=${COOKIE_SECURE:true}
jwt.cookie-same-site=${COOKIE_SAME_SITE:None}

# Solo exponer health (para el health check de Render)
management.endpoints.web.exposure.include=health

logging.level.root=INFO
